<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      :root {
        --bg: #f0f2f5;
        --container-bg: #fff;
        --shadow: rgba(0, 0, 0, 0.1);
        --heading: #1a1a2e;
        --input-border: #ddd;
        --item-bg: #f8f9ff;
        --item-border: #e5e7f0;
        --text: #333;
        --empty: #aaa;
        --delete-hover-bg: #fff0f0;
      }

      body.dark {
        --bg: #0f0f1a;
        --container-bg: #1e1e2e;
        --shadow: rgba(0, 0, 0, 0.4);
        --heading: #e0e0f0;
        --input-border: #444;
        --item-bg: #252535;
        --item-border: #333348;
        --text: #d0d0e0;
        --empty: #666;
        --delete-hover-bg: #3a1a1a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 16px;
        transition: background 0.3s;
      }

      .container {
        background: var(--container-bg);
        border-radius: 12px;
        box-shadow: 0 4px 24px var(--shadow);
        padding: 32px;
        width: 100%;
        max-width: 480px;
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }

      .header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        margin-bottom: 24px;
      }

      h1 {
        grid-column: 2;
        font-size: 1.8rem;
        color: var(--heading);
        text-align: center;
      }

      #theme-toggle {
        grid-column: 3;
        justify-self: end;
        background: #4f46e5;
        border: none;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
        transition: background 0.2s;
      }

      #theme-toggle:hover {
        background: #4338ca;
      }

      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }

      #todo-input {
        flex: 1;
        padding: 10px 14px;
        border: 2px solid var(--input-border);
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        background: var(--item-bg);
        color: var(--text);
        transition: border-color 0.2s, background 0.3s;
      }

      #todo-input:focus {
        border-color: #4f46e5;
      }

      #add-btn {
        padding: 10px 18px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      #add-btn:hover {
        background: #4338ca;
      }

      #todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .todo-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--item-bg);
        border: 1px solid var(--item-border);
        border-radius: 8px;
        padding: 12px 14px;
        animation: slide-in 0.2s ease;
        transition: background 0.3s, border-color 0.3s;
      }

      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .todo-text {
        font-size: 1rem;
        color: var(--text);
        word-break: break-word;
        flex: 1;
      }

      .delete-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: #999;
        font-size: 1.1rem;
        padding: 4px 8px;
        border-radius: 6px;
        transition:
          color 0.2s,
          background 0.2s;
        margin-left: 12px;
        flex-shrink: 0;
      }

      .delete-btn:hover {
        color: #e53e3e;
        background: var(--delete-hover-bg);
      }

      .empty-msg {
        text-align: center;
        color: var(--empty);
        font-size: 0.95rem;
        padding: 16px 0;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
        border-bottom: 2px solid var(--item-border);
        padding-bottom: 0;
      }

      .tab-btn {
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        padding: 8px 16px;
        font-size: 0.95rem;
        cursor: pointer;
        color: var(--empty);
        margin-bottom: -2px;
        border-radius: 4px 4px 0 0;
        transition: color 0.2s, border-color 0.2s;
      }

      .tab-btn:hover {
        color: var(--text);
      }

      .tab-btn.active {
        color: #4f46e5;
        border-bottom-color: #4f46e5;
        font-weight: 600;
      }

      .todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .deleted-item .todo-text {
        text-decoration: line-through;
        color: var(--empty);
      }

      .deleted-item .delete-btn {
        display: none;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Todo List</h1>
        <button id="theme-toggle" aria-label="Toggle dark/light theme">🌙</button>
      </div>
      <div class="input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a new todo..."
          maxlength="200"
          aria-label="New todo"
        />
        <button id="add-btn" aria-label="Add todo">Add</button>
      </div>
      <nav class="tabs" role="tablist" aria-label="Todo filter tabs">
        <button class="tab-btn active" role="tab" aria-selected="true" data-tab="all">All</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="deleted">Deleted</button>
      </nav>
      <ul id="todo-list" class="todo-list" aria-label="Todo list"></ul>
      <ul id="deleted-list" class="todo-list" aria-label="Deleted todos" hidden></ul>
    </div>

    <script>
      const input = document.getElementById("todo-input");
      const addBtn = document.getElementById("add-btn");
      const list = document.getElementById("todo-list");
      const deletedList = document.getElementById("deleted-list");
      const themeToggle = document.getElementById("theme-toggle");
      const tabBtns = document.querySelectorAll(".tab-btn");

      let currentTab = "all";

      // Restore saved theme preference
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        themeToggle.textContent = "☀️";
      }

      themeToggle.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        themeToggle.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });

      tabBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          currentTab = btn.dataset.tab;
          tabBtns.forEach((b) => {
            b.classList.toggle("active", b === btn);
            b.setAttribute("aria-selected", b === btn ? "true" : "false");
          });
          list.hidden = currentTab !== "all";
          deletedList.hidden = currentTab !== "deleted";
        });
      });

      function renderEmpty() {
        const existing = list.querySelector(".empty-msg");
        if (list.querySelectorAll(".todo-item").length === 0 && !existing) {
          const msg = document.createElement("li");
          msg.className = "empty-msg";
          msg.textContent = "No todos yet. Add one above!";
          list.appendChild(msg);
        } else if (list.querySelectorAll(".todo-item").length > 0 && existing) {
          existing.remove();
        }

        const existingDeleted = deletedList.querySelector(".empty-msg");
        if (deletedList.querySelectorAll(".todo-item").length === 0 && !existingDeleted) {
          const msg = document.createElement("li");
          msg.className = "empty-msg";
          msg.textContent = "No deleted todos.";
          deletedList.appendChild(msg);
        } else if (deletedList.querySelectorAll(".todo-item").length > 0 && existingDeleted) {
          existingDeleted.remove();
        }
      }

      function addTodo() {
        const text = input.value.trim();
        if (!text) return;

        // Remove empty message if present
        const emptyMsg = list.querySelector(".empty-msg");
        if (emptyMsg) emptyMsg.remove();

        const li = document.createElement("li");
        li.className = "todo-item";

        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "✕";
        deleteBtn.setAttribute("aria-label", "Delete todo");
        deleteBtn.addEventListener("click", () => {
          li.classList.add("deleted-item");
          const deletedEmptyMsg = deletedList.querySelector(".empty-msg");
          if (deletedEmptyMsg) deletedEmptyMsg.remove();
          deletedList.appendChild(li);
          renderEmpty();
        });

        li.appendChild(span);
        li.appendChild(deleteBtn);
        list.appendChild(li);

        input.value = "";
        input.focus();
      }

      addBtn.addEventListener("click", addTodo);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTodo();
      });

      renderEmpty();
    </script>
  </body>
</html>
