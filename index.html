<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Design tokens ──────────────────────────────────────────── */
      :root {
        --accent: #6c63ff;
        --accent-dark: #574fd6;
        --accent-glow: rgba(108, 99, 255, 0.35);

        --bg-start: #e8eaf6;
        --bg-end: #f3e5f5;
        --container-bg: rgba(255, 255, 255, 0.82);
        --container-border: rgba(255, 255, 255, 0.6);
        --shadow-color: rgba(108, 99, 255, 0.12);

        --heading: #1a1033;
        --subtext: #7c7c9a;
        --text: #2d2d44;

        --input-bg: rgba(255, 255, 255, 0.9);
        --input-border: #d0d0e8;

        --item-bg: rgba(255, 255, 255, 0.75);
        --item-border: rgba(200, 200, 230, 0.6);
        --item-shadow: rgba(108, 99, 255, 0.06);

        --check-border: #c5c5dd;
        --check-done-bg: #6c63ff;

        --delete-color: #b0aec8;
        --delete-hover-color: #e53e3e;
        --delete-hover-bg: rgba(229, 62, 62, 0.08);

        --filter-bg: rgba(108, 99, 255, 0.08);
        --filter-active-bg: #6c63ff;
        --filter-active-text: #fff;

        --badge-bg: #6c63ff;
        --badge-text: #fff;

        --empty-color: #a0a0bc;

        --toggle-bg: rgba(108, 99, 255, 0.12);
        --toggle-hover-bg: rgba(108, 99, 255, 0.2);
      }

      body.dark {
        --bg-start: #0d0b1e;
        --bg-end: #120d24;
        --container-bg: rgba(26, 22, 50, 0.88);
        --container-border: rgba(108, 99, 255, 0.18);
        --shadow-color: rgba(0, 0, 0, 0.5);

        --heading: #e8e5ff;
        --subtext: #7a77a0;
        --text: #ccc8f0;

        --input-bg: rgba(30, 26, 60, 0.9);
        --input-border: #3a3660;

        --item-bg: rgba(30, 26, 60, 0.7);
        --item-border: rgba(80, 75, 130, 0.4);
        --item-shadow: rgba(0, 0, 0, 0.25);

        --check-border: #4a4675;
        --check-done-bg: #6c63ff;

        --delete-color: #5a5878;
        --delete-hover-color: #fc8181;
        --delete-hover-bg: rgba(252, 129, 129, 0.1);

        --filter-bg: rgba(108, 99, 255, 0.12);
        --filter-active-bg: #6c63ff;
        --filter-active-text: #fff;

        --badge-bg: #6c63ff;
        --badge-text: #fff;

        --empty-color: #4e4b6e;

        --toggle-bg: rgba(108, 99, 255, 0.15);
        --toggle-hover-bg: rgba(108, 99, 255, 0.28);
      }

      /* ── Reset ──────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Body / background ──────────────────────────────────────── */
      body {
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 64px 16px 80px;
        transition: background 0.4s;
      }

      /* ── Glassmorphism card ─────────────────────────────────────── */
      .container {
        background: var(--container-bg);
        border: 1px solid var(--container-border);
        border-radius: 20px;
        box-shadow:
          0 8px 32px var(--shadow-color),
          0 2px 8px rgba(0, 0, 0, 0.06);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 36px 32px 28px;
        width: 100%;
        max-width: 520px;
        transition: background 0.4s, box-shadow 0.4s, border-color 0.4s;
      }

      /* ── Header ─────────────────────────────────────────────────── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: var(--heading);
        line-height: 1.1;
      }

      .subtitle {
        font-size: 0.8rem;
        color: var(--subtext);
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      #theme-toggle {
        background: var(--toggle-bg);
        border: none;
        border-radius: 10px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.15rem;
        transition: background 0.25s, transform 0.2s;
        flex-shrink: 0;
      }

      #theme-toggle:hover {
        background: var(--toggle-hover-bg);
        transform: rotate(20deg);
      }

      /* ── Input row ──────────────────────────────────────────────── */
      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      #todo-input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid var(--input-border);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        background: var(--input-bg);
        color: var(--text);
        transition: border-color 0.2s, background 0.4s, box-shadow 0.2s;
      }

      #todo-input::placeholder {
        color: var(--empty-color);
      }

      #todo-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-glow);
      }

      #add-btn {
        padding: 12px 20px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        white-space: nowrap;
        box-shadow: 0 4px 14px var(--accent-glow);
      }

      #add-btn:hover {
        background: var(--accent-dark);
        transform: translateY(-1px);
        box-shadow: 0 6px 18px var(--accent-glow);
      }

      #add-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px var(--accent-glow);
      }

      /* ── Filter tabs ────────────────────────────────────────────── */
      .filters {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
      }

      .filter-btn {
        flex: 1;
        padding: 7px 10px;
        border: none;
        border-radius: 9px;
        font-size: 0.8rem;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        background: var(--filter-bg);
        color: var(--subtext);
        transition: background 0.2s, color 0.2s, transform 0.15s;
        letter-spacing: 0.02em;
      }

      .filter-btn:hover {
        background: rgba(108, 99, 255, 0.15);
        color: var(--accent);
      }

      .filter-btn.active {
        background: var(--filter-active-bg);
        color: var(--filter-active-text);
        box-shadow: 0 2px 8px var(--accent-glow);
      }

      /* ── Task counter ───────────────────────────────────────────── */
      .task-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        min-height: 24px;
      }

      .task-count {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--subtext);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .badge {
        background: var(--badge-bg);
        color: var(--badge-text);
        font-size: 0.72rem;
        font-weight: 700;
        border-radius: 20px;
        padding: 2px 9px;
        display: inline-flex;
        align-items: center;
        min-width: 24px;
        justify-content: center;
        box-shadow: 0 2px 6px var(--accent-glow);
        transition: transform 0.2s;
      }

      /* ── Todo list ──────────────────────────────────────────────── */
      #todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ── Todo item ──────────────────────────────────────────────── */
      .todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--item-bg);
        border: 1px solid var(--item-border);
        border-radius: 13px;
        padding: 13px 14px;
        box-shadow: 0 2px 8px var(--item-shadow);
        animation: slide-in 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        transition: background 0.4s, border-color 0.4s, box-shadow 0.25s, opacity 0.25s, transform 0.25s;
      }

      .todo-item:hover {
        box-shadow: 0 4px 16px var(--item-shadow);
        border-color: rgba(108, 99, 255, 0.2);
      }

      .todo-item.removing {
        animation: slide-out 0.25s ease forwards;
      }

      /* ── Checkbox ───────────────────────────────────────────────── */
      .todo-checkbox {
        appearance: none;
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid var(--check-border);
        border-radius: 6px;
        cursor: pointer;
        flex-shrink: 0;
        position: relative;
        transition: border-color 0.2s, background 0.2s, transform 0.15s;
        background: transparent;
      }

      .todo-checkbox:hover {
        border-color: var(--accent);
        transform: scale(1.08);
      }

      .todo-checkbox:checked {
        background: var(--check-done-bg);
        border-color: var(--check-done-bg);
      }

      .todo-checkbox:checked::after {
        content: "";
        position: absolute;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 12 10' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 5l3.5 3.5L11 1' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E")
          center / 11px no-repeat;
      }

      /* ── Todo text ──────────────────────────────────────────────── */
      .todo-text {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text);
        word-break: break-word;
        flex: 1;
        line-height: 1.4;
        transition: color 0.25s, text-decoration 0.25s;
      }

      .todo-item.done .todo-text {
        color: var(--subtext);
        text-decoration: line-through;
        text-decoration-color: var(--subtext);
      }

      /* ── Delete button ──────────────────────────────────────────── */
      .delete-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--delete-color);
        font-size: 1rem;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        transition: color 0.2s, background 0.2s, transform 0.15s;
        flex-shrink: 0;
        opacity: 0;
      }

      .todo-item:hover .delete-btn {
        opacity: 1;
      }

      .delete-btn:hover {
        color: var(--delete-hover-color);
        background: var(--delete-hover-bg);
        transform: scale(1.15);
      }

      /* ── Empty state ────────────────────────────────────────────── */
      .empty-state {
        text-align: center;
        padding: 32px 16px;
        animation: fade-in 0.4s ease;
      }

      .empty-icon {
        font-size: 2.8rem;
        margin-bottom: 10px;
        display: block;
      }

      .empty-msg {
        color: var(--empty-color);
        font-size: 0.9rem;
        font-weight: 500;
      }

      /* ── Animations ─────────────────────────────────────────────── */
      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translateY(-10px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes slide-out {
        from {
          opacity: 1;
          transform: translateX(0) scale(1);
          max-height: 300px;
          margin-bottom: 0;
        }
        to {
          opacity: 0;
          transform: translateX(18px) scale(0.95);
          max-height: 0;
          margin-bottom: -8px;
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ── Scrollbar (WebKit) ─────────────────────────────────────── */
      #todo-list::-webkit-scrollbar {
        width: 5px;
      }

      #todo-list::-webkit-scrollbar-thumb {
        background: rgba(108, 99, 255, 0.3);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <h1>My Todos</h1>
          <span class="subtitle">Stay focused, get things done</span>
        </div>
        <button id="theme-toggle" aria-label="Toggle dark/light theme">🌙</button>
      </div>

      <!-- Input -->
      <div class="input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          maxlength="200"
          aria-label="New todo"
        />
        <button id="add-btn" aria-label="Add todo">+ Add</button>
      </div>

      <!-- Filters -->
      <div class="filters" role="group" aria-label="Filter todos">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>

      <!-- Task info bar -->
      <div class="task-info">
        <span class="task-count" id="task-count"></span>
        <span class="badge" id="active-badge" aria-live="polite">0</span>
      </div>

      <!-- List -->
      <ul id="todo-list" aria-label="Todo list"></ul>
    </div>

    <script>
      const input = document.getElementById("todo-input");
      const addBtn = document.getElementById("add-btn");
      const list = document.getElementById("todo-list");
      const themeToggle = document.getElementById("theme-toggle");
      const taskCount = document.getElementById("task-count");
      const activeBadge = document.getElementById("active-badge");
      const filterBtns = document.querySelectorAll(".filter-btn");

      let currentFilter = "all";

      /* ── Theme ── */
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        themeToggle.textContent = "☀️";
      }

      themeToggle.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        themeToggle.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });

      /* ── Filters ── */
      filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          applyFilter();
        });
      });

      function applyFilter() {
        const items = list.querySelectorAll(".todo-item");
        items.forEach((item) => {
          const done = item.classList.contains("done");
          if (
            currentFilter === "all" ||
            (currentFilter === "done" && done) ||
            (currentFilter === "active" && !done)
          ) {
            item.style.display = "";
          } else {
            item.style.display = "none";
          }
        });
        updateInfo();
      }

      /* ── Stats ── */
      function updateInfo() {
        const items = list.querySelectorAll(".todo-item");
        const total = items.length;
        const doneCount = list.querySelectorAll(".todo-item.done").length;
        const activeCount = total - doneCount;

        activeBadge.textContent = activeCount;

        if (total === 0) {
          taskCount.textContent = "";
        } else {
          taskCount.textContent = `${doneCount} of ${total} completed`;
        }

        renderEmpty(total);
      }

      /* ── Empty state ── */
      function renderEmpty(total) {
        const existing = list.querySelector(".empty-state");
        if (total === 0 && !existing) {
          const div = document.createElement("li");
          div.className = "empty-state";
          div.setAttribute("role", "status");
          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.textContent = "✅";
          const msg = document.createElement("p");
          msg.className = "empty-msg";
          msg.textContent = "No todos yet. Add one above to get started!";
          div.appendChild(icon);
          div.appendChild(msg);
          list.appendChild(div);
        } else if (total > 0 && existing) {
          existing.remove();
        }
      }

      /* ── Add todo ── */
      function addTodo() {
        const text = input.value.trim();
        if (!text) return;

        // Remove empty state if present
        const emptyState = list.querySelector(".empty-state");
        if (emptyState) emptyState.remove();

        const li = document.createElement("li");
        li.className = "todo-item";

        // Checkbox
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "todo-checkbox";
        checkbox.setAttribute("aria-label", "Mark as done");
        checkbox.addEventListener("change", () => {
          li.classList.toggle("done", checkbox.checked);
          applyFilter();
        });

        // Text
        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = text;

        // Delete
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "\u2715";
        deleteBtn.setAttribute("aria-label", "Delete todo");
        deleteBtn.addEventListener("click", () => {
          li.classList.add("removing");
          li.addEventListener("animationend", () => {
            li.remove();
            updateInfo();
          });
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        list.appendChild(li);

        input.value = "";
        input.focus();
        updateInfo();
        applyFilter();
      }

      addBtn.addEventListener("click", addTodo);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTodo();
      });

      updateInfo();
    </script>
  </body>
</html>
